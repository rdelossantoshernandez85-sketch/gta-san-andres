// ---- 00-core.js ----
'use strict';
// ====== NÚCLEO: utilidades, aleatorio, matemáticas ======
const $=id=>document.getElementById(id),PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sat=v=>v<0?0:v>1?1:v;
const sstep=(a,b,v)=>{const t=sat((v-a)/(b-a));return t*t*(3-2*t)};
const adiff=(a,b)=>{let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
const R=Math.random,rf=(a,b)=>a+R()*(b-a),rpick=a=>a[(R()*a.length)|0];
let _seed=1234567;function srand(s){_seed=s>>>0||1}

// ruido de valor 2D
function hash2(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v)}
function fbm(x,y,o){let s=0,a=.5,f=1;for(let i=0;i<(o||4);i++){s+=a*vnoise(x*f,y*f);f*=2.03;a*=.5}return s}
// matrices 4x4 (columna mayor)
const _t=new Float32Array(16);
const m4={
 id(o){o.fill(0);o[0]=o[5]=o[10]=o[15]=1;return o},
 mul(o,a,b){for(let c=0;c<4;c++){const b0=b[c*4],b1=b[c*4+1],b2=b[c*4+2],b3=b[c*4+3];

   _t[c*4+2]=a[2]*b0+a[6]*b1+a[10]*b2+a[14]*b3;_t[c*4+3]=a[3]*b0+a[7]*b1+a[11]*b2+a[15]*b3}
  for(let i=0;i<16;i++)o[i]=_t[i];return o},
 // R = Ry(yaw)*Rx(pitch)*Rz(roll), escala, traslación
 trs(o,x,y,z,yaw,pt,rl,sx,sy,sz){const cy=Math.cos(yaw),sy_=Math.sin(yaw),cx=Math.cos(pt),sxn=Math.sin(pt),cz=Math.cos(rl),sz_=Math.sin(rl);
  sx=sx===undefined?1:sx;sy=sy===undefined?sx:sy;sz=sz===undefined?sx:sz;
  o[0]=(cy*cz+sy_*sxn*sz_)*sx;o[1]=cx*sz_*sx;o[2]=(-sy_*cz+cy*sxn*sz_)*sx;o[3]=0;
  o[4]=(-cy*sz_+sy_*sxn*cz)*sy;o[5]=cx*cz*sy;o[6]=(sy_*sz_+cy*sxn*cz)*sy;o[7]=0;
  o[8]=sy_*cx*sz;o[9]=-sxn*sz;o[10]=cy*cx*sz;o[11]=0;o[12]=x;o[13]=y;o[14]=z;o[15]=1;return o},
 persp(o,fov,asp,n,f){const t=1/Math.tan(fov/2);o.fill(0);o[0]=t/asp;o[5]=t;o[10]=(f+n)/(n-f);o[11]=-1;o[14]=2*f*n/(n-f);return o},
 ortho(o,l,r,b,t,n,f){o.fill(0);o[0]=2/(r-l);o[5]=2/(t-b);o[10]=-2/(f-n);o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;return o},
 look(o,ex,ey,ez,tx,ty,tz,ux,uy,uz){let fx=tx-ex,fy=ty-ey,fz=tz-ez,l=Math.hypot(fx,fy,fz)||1;fx/=l;fy/=l;fz/=l;
  let sx=fy*uz-fz*uy,sy=fz*ux-fx*uz,sz=fx*uy-fy*ux;l=Math.hypot(sx,sy,sz)||1;sx/=l;sy/=l;sz/=l;

  o[0]=sx;o[1]=vx;o[2]=-fx;o[3]=0;o[4]=sy;o[5]=vy;o[6]=-fy;o[7]=0;o[8]=sz;o[9]=vz;o[10]=-fz;o[11]=0;
  o[12]=-(sx*ex+sy*ey+sz*ez);o[13]=-(vx*ex+vy*ey+vz*ez);o[14]=(fx*ex+fy*ey+fz*ez);o[15]=1;return o},
 rotX(o,a){m4.id(o);const c=Math.cos(a),s=Math.sin(a);o[5]=c;o[6]=s;o[9]=-s;o[10]=c;return o},
 rotY(o,a){m4.id(o);const c=Math.cos(a),s=Math.sin(a);o[0]=c;o[2]=-s;o[8]=s;o[10]=c;return o},
 rotZ(o,a){m4.id(o);const c=Math.cos(a),s=Math.sin(a);o[0]=c;o[1]=s;o[4]=-s;o[5]=c;return o},
 tr(o,x,y,z){m4.id(o);o[12]=x;o[13]=y;o[14]=z;return o},
 copy(o,a){for(let i=0;i<16;i++)o[i]=a[i];return o}
};
const f16=()=>new Float32Array(16);
// color hex -> [r,g,b] 0..255
const hx=c=>[(c>>16)&255,(c>>8)&255,c&255];
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const shade=(c,k)=>[clamp(c[0]*k,0,255),clamp(c[1]*k,0,255),clamp(c[2]*k,0,255)];

// ---- 10-mesh.js ----
// ====== CONSTRUCTOR DE MALLAS ======
// vértice: pos f32x3 | nrm i8x4 | col u8x4 (rgb + material) | uv f32x2 | aux u8x4 (capa, emisivo, viento, flags)
const MT={N:0,PAINT:60,GLASS:110,METAL:160,LIGHT:220};
class MB{
 constructor(cap){this.cap=cap||2048;this.n=0;this.ni=0;this.buf=new ArrayBuffer(this.cap*32);this.f=new Float32Array(this.buf);this.i8=new Int8Array(this.buf);this.u8=new Uint8Array(this.buf);this.idx=new Uint32Array(this.cap*4);
  this.M=m4.id(f16());this.stk=[];this.c=[200,200,200];this.mat=0;this.lay=255;this.em=0;this.wd=0;this.fl=0;this.us=.125;this.dbl=false}
 grow(){const c2=this.cap*2,nb=new ArrayBuffer(c2*32);new Uint8Array(nb).set(this.u8);this.buf=nb;this.f=new Float32Array(nb);this.i8=new Int8Array(nb);this.u8=new Uint8Array(nb);
  const ni=new Uint32Array(c2*4);ni.set(this.idx);this.idx=ni;this.cap=c2}
 // estilo
 s(c,mat,lay,em,wd,fl){if(typeof c==='number')c=hx(c);this.c=c;this.mat=mat||0;this.lay=lay===undefined?255:lay;this.em=em||0;this.wd=wd||0;this.fl=fl||0;return this}
 push(){this.stk.push(Float32Array.from(this.M));return this}
 pop(){this.M=this.stk.pop();return this}
 tr(x,y,z){m4.mul(this.M,this.M,m4.tr(_a,x,y,z));return this}
 rot(yaw,pt,rl){m4.mul(this.M,this.M,m4.trs(_a,0,0,0,yaw||0,pt||0,rl||0,1,1,1));return this}
 sc(x,y,z){m4.mul(this.M,this.M,m4.trs(_a,0,0,0,0,0,0,x,y===undefined?x:y,z===undefined?x:z));return this}
 V(x,y,z,nx,ny,nz,u,v){if(this.n>=this.cap)this.grow();const M=this.M;
  const X=M[0]*x+M[4]*y+M[8]*z+M[12],Y=M[1]*x+M[5]*y+M[9]*z+M[13],Z=M[2]*x+M[6]*y+M[10]*z+M[14];
  let NX=M[0]*nx+M[4]*ny+M[8]*nz,NY=M[1]*nx+M[5]*ny+M[9]*nz,NZ=M[2]*nx+M[6]*ny+M[10]*nz;const l=Math.hypot(NX,NY,NZ)||1;NX/=l;NY/=l;NZ/=l;
  const n=this.n++,o=n*8,b=n*32,f=this.f,i8=this.i8,u8=this.u8,c=this.c;f[o]=X;f[o+1]=Y;f[o+2]=Z;
  i8[b+12]=Math.round(NX*127);i8[b+13]=Math.round(NY*127);i8[b+14]=Math.round(NZ*127);i8[b+15]=0;
  u8[b+16]=c[0];u8[b+17]=c[1];u8[b+18]=c[2];u8[b+19]=this.mat;f[o+5]=u;f[o+6]=v;
  u8[b+28]=this.lay;u8[b+29]=this.em;u8[b+30]=this.wd;u8[b+31]=this.fl;return n}
 tri(a,b,c){if(this.ni+6>=this.idx.length){const ni=new Uint32Array(this.idx.length*2);ni.set(this.idx);this.idx=ni}const I=this.idx;I[this.ni++]=a;I[this.ni++]=b;I[this.ni++]=c}

 // quad con 4 puntos locales, normal calculada; uv en metros*us o explícitos
 q4(p0,p1,p2,p3,u1,v1){const ax=p1[0]-p0[0],ay=p1[1]-p0[1],az=p1[2]-p0[2],bx=p3[0]-p0[0],by=p3[1]-p0[1],bz=p3[2]-p0[2];
  let nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
  if(u1===undefined){u1=Math.hypot(ax,ay,az)*this.us;v1=Math.hypot(bx,by,bz)*this.us}

  this.quad(a,b,c,d);if(this.dbl){const e=this.V(p0[0],p0[1],p0[2],-nx,-ny,-nz,0,0),f=this.V(p1[0],p1[1],p1[2],-nx,-ny,-nz,u1,0),g=this.V(p2[0],p2[1],p2[2],-nx,-ny,-nz,u1,v1),h=this.V(p3[0],p3[1],p3[2],-nx,-ny,-nz,0,v1);this.quad(e,h,g,f)}return this}
 tri3(p0,p1,p2){const ax=p1[0]-p0[0],ay=p1[1]-p0[1],az=p1[2]-p0[2],bx=p2[0]-p0[0],by=p2[1]-p0[1],bz=p2[2]-p0[2];
  let nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
  const a=this.V(p0[0],p0[1],p0[2],nx,ny,nz,0,0),b=this.V(p1[0],p1[1],p1[2],nx,ny,nz,1,0),c=this.V(p2[0],p2[1],p2[2],nx,ny,nz,0,1);this.tri(a,b,c);
  if(this.dbl){const d=this.V(p0[0],p0[1],p0[2],-nx,-ny,-nz,0,0),e=this.V(p1[0],p1[1],p1[2],-nx,-ny,-nz,1,0),f=this.V(p2[0],p2[1],p2[2],-nx,-ny,-nz,0,1);this.tri(d,f,e)}return this}
 // caja centrada en (cx,cy,cz)
 box(cx,cy,cz,w,h,d){const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2,z0=cz-d/2,z1=cz+d/2,u=this.us;

  this.q4([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],w*u,h*u);this.q4([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],w*u,h*u);
  this.q4([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],w*u,d*u);this.q4([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],w*u,d*u);return this}

   e=[cx-w1/2,y1,cz+d1/2],f=[cx+w1/2,y1,cz+d1/2],g=[cx+w1/2,y1,cz-d1/2],hh=[cx-w1/2,y1,cz-d1/2];
  this.q4(a,b,f,e);this.q4(b,c,g,f);this.q4(c,d,hh,g);this.q4(d,a,e,hh);this.q4(e,f,g,hh);this.q4(d,c,b,a);return this}
 // cilindro/cono con base en cy hacia arriba
 cyl(cx,cy,cz,r0,r1,h,seg,caps){seg=seg||10;const ring0=this.n;
  for(let i=0;i<=seg;i++){const a=i/seg*TAU,ca=Math.cos(a),sa=Math.sin(a),sl=(r0-r1)/(h||1),nl=Math.hypot(1,sl);

function carryOnShip(e,s,dt){if(!s.dyaw&&!s.vx&&!s.vz)return;const ox=e.x-s.px,oz=e.z-s.pz,c=Math.cos(s.dyaw),sn=Math.sin(s.dyaw);e.x=s.x+ox*c+oz*sn;e.z=s.z-ox*sn+oz*c;e.yaw+=s.dyaw}
// colisiones círculo vs cajas; devuelve {nx,nz,pen} del mayor empuje
function circleBoxes(x,z,r,y,out){let hit=null;boxesNear(x,z,_bx);for(const b of _bx){if(y>b.y1-.2||y+1.5<b.y0)continue;const cx=clamp(x,b.x0,b.x1),cz=clamp(z,b.z0,b.z1);let dx=x-cx,dz=z-cz,d2=dx*dx+dz*dz;

function camColl(tx,ty,tz,cx,cy,cz){let k=1;const n=14;for(let i=1;i<=n;i++){const f=i/n,x=tx+(cx-tx)*f,y=ty+(cy-ty)*f,z=tz+(cz-tz)*f;if(boxHeightAt(x,z,y+.3)>y-.05&&boxHeightAt(x,z,y+.3)<1e8){k=Math.max(.1,(i-1.4)/n);break}if(y<groundH(x,z)+.25){k=Math.max(.1,(i-1)/n);break}}return k}

 CAMC.idle+=dt;
 if(v){tx=v.x;tz=v.z;let hh=v.kind==='plane'?3:v.kind==='heli'?2.8:v.kind==='ship'?(v.H||10)*.5+4:1.7;if(v.kind==='car'&&v.base==='bus')hh=3;ty=v.y+hh;
  const base=v.kind==='car'?(v.S.L*1.6+3.5):v.kind==='bike'?5.5:v.kind==='heli'?17:v.kind==='plane'?(v.type==='jet'?30:22):Math.max(32,(v.L||80)*.75);CAMC.dist+=(base*CAMC.zoom-CAMC.dist)*Math.min(1,dt*3);dist=CAMC.dist;
  if(CAMC.idle>(v.kind==='ship'?2.5:1.6)){let ty_=v.yaw;if(v.kind==='car'||v.kind==='bike'){const sp=Math.hypot(v.vx,v.vz);if(sp>3&&(v.speed||0)>0)ty_=Math.atan2(v.vx,v.vz)}

  if(v.kind==='car'&&Math.abs(v.speed||0)>8)dist+=Math.min(2.5,Math.abs(v.speed)*.04)}
 else{const aim=p.aimOn;const base=aim?2.4:CAMC.zoom>1?6.5:4.6;CAMC.dist+=(base-CAMC.dist)*Math.min(1,dt*6);dist=CAMC.dist;tx=p.x;tz=p.z;ty=p.y+(p.swim?.8:1.55);
